<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders — Ansh Mart</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar" id="navbar"></nav>

<div class="container" style="padding-top:2rem;padding-bottom:3rem;">
  <h1 class="section-title">My Orders</h1>
  <p class="section-subtitle">Track your order history and status</p>

  <div id="orders-container">
    <div class="spinner-wrap"><div class="spinner"></div></div>
  </div>
</div>

<div id="toast"></div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    if (!requireAuth()) return;
    renderNavbar('orders');
    await loadOrders();
  });

  async function loadOrders() {
    const container = document.getElementById('orders-container');
    try {
      const orders = await api.get('/orders/my');

      if (orders.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon">📦</div>
            <h3>No orders yet</h3>
            <p>You haven't placed any orders. Start shopping!</p>
            <a href="products.html" class="btn btn-primary" style="margin-top:1.25rem;">Browse Products</a>
          </div>`;
        return;
      }

      container.innerHTML = orders.map(order => `
        <div class="order-card">
          <div class="order-header">
            <div>
              <div class="order-id">Order #${order.id}</div>
              <div class="order-date">Placed on ${formatDate(order.created_at)}</div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:.4rem;">
              ${statusBadge(order.status)}
              <span style="font-weight:700;color:var(--primary);">${formatCurrency(order.total_amount)}</span>
            </div>
          </div>
          <div class="order-body">
            <div style="margin-bottom:.75rem;">
              ${order.items.map(item => `
                <div class="order-item-row">
                  <span>
                    ${item.image_url ? `<img src="${item.image_url}" alt="" style="width:28px;height:28px;object-fit:cover;border-radius:4px;vertical-align:middle;margin-right:.4rem;"
                         onerror="this.style.display='none'">` : ''}
                    ${item.product_name} × ${item.quantity}
                  </span>
                  <span style="font-weight:600;">${formatCurrency(item.unit_price * item.quantity)}</span>
                </div>`).join('')}
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;font-size:.85rem;color:var(--text-muted);">
              <span>📍 ${order.shipping_address}</span>
              <span>·</span>
              <span>📞 ${order.phone}</span>
            </div>
          </div>
        </div>
      `).join('');

    } catch (err) {
      container.innerHTML = `<div class="alert alert-danger">❌ ${err.message}</div>`;
    }
  }
</script>
</body>
</html>
